<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jeu de dictée - Orthographe</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f2efff, #eef8ff);
        min-height: 100vh;
        padding: 25px 15px;
        color: #222;
      }

      .container {
        max-width: 750px;
        margin: auto;
      }

      header {
        text-align: center;
        margin-bottom: 25px;
      }

      header h1 {
        font-size: 34px;
        margin-bottom: 8px;
      }

      header p {
        color: #666;
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .tabs button {
        flex: 1;
        border: 0;
        padding: 14px;
        border-radius: 12px;
        background: white;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
      }

      .tabs button.active {
        background: #6548e8;
        color: white;
      }

      .section {
        display: none;
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .section.active {
        display: block;
      }

      input {
        width: 100%;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 18px;
        outline: none;
      }

      input:focus {
        border-color: #6548e8;
      }

      .btn {
        border: 0;
        padding: 14px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        margin-top: 15px;
      }

      .primary {
        background: #6548e8;
        color: white;
      }

      .secondary {
        background: #eee;
        color: #222;
      }

      .danger {
        background: #ffe8e8;
        color: #d33;
      }

      .message {
        margin-top: 15px;
        font-weight: bold;
      }

      .word-list {
        margin-top: 20px;
      }

      .word-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px;
        margin-bottom: 10px;
        background: #f7f7fb;
        border-radius: 12px;
      }

      .word-item strong {
        font-size: 18px;
      }

      .game {
        text-align: center;
      }

      .score {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
      }

      .progress {
        height: 8px;
        background: #eee;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 30px;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: #6548e8;
        transition: width 0.3s;
      }

      .listen {
        font-size: 65px;
        margin: 20px 0;
      }

      .game h2 {
        margin-bottom: 10px;
      }

      .instruction {
        color: #666;
        margin-bottom: 25px;
      }

      .answer-input {
        max-width: 500px;
        margin: auto;
        text-align: center;
        font-size: 22px;
      }

      .feedback {
        min-height: 35px;
        margin-top: 20px;
        font-size: 19px;
        font-weight: bold;
      }

      .correct {
        color: #209447;
      }

      .wrong {
        color: #d33;
      }

      .correct-word {
        margin-top: 10px;
        font-size: 18px;
      }

      .empty {
        text-align: center;
        color: #777;
        padding: 25px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 600px) {
        header h1 {
          font-size: 27px;
        }

        .tabs {
          flex-direction: column;
        }

        .word-item {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>🎧 Jeu de dictée</h1>
        <p>Écoute le mot et écris-le correctement.</p>
      </header>

      <div class="tabs">
        <button class="tab active" data-section="ajouter">➕ Mes mots</button>

        <button class="tab" data-section="jeu">🎧 Dictée</button>

        <button class="tab" data-section="liste">📚 Liste</button>
      </div>

      <!-- AJOUTER LES MOTS -->

      <section id="ajouter" class="section active">
        <h2>Ajouter un mot</h2>

        <p>Ajoute les mots que tu veux apprendre.</p>

        <input
          type="text"
          id="wordInput"
          placeholder="Exemple : extraordinaire"
          autocomplete="off"
        />

        <button class="btn primary" id="addWord">➕ Ajouter</button>

        <div class="message" id="addMessage"></div>
      </section>

      <!-- JEU DE DICTÉE -->

      <section id="jeu" class="section">
        <div class="game">
          <div class="score">
            ⭐ Score :
            <span id="score">0</span>
          </div>

          <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
          </div>

          <div id="gameContent">
            <div class="listen">🎧</div>

            <h2>Prêt pour la dictée ?</h2>

            <p class="instruction">
              Le jeu va prononcer un mot. Écris-le sans regarder.
            </p>

            <button class="btn primary" id="startGame">🎮 Commencer</button>
          </div>
        </div>
      </section>

      <!-- LISTE -->

      <section id="liste" class="section">
        <h2>📚 Mes mots</h2>

        <div class="word-list" id="wordList"></div>
      </section>
    </div>

    <script>
      /* =========================
   DONNÉES
========================= */

      let words = JSON.parse(localStorage.getItem("dictationWords")) || [];

      let quizWords = [];

      let currentIndex = 0;

      let score = 0;

      let waiting = false;

      /* =========================
   NAVIGATION
========================= */

      const tabs = document.querySelectorAll(".tab");

      const sections = document.querySelectorAll(".section");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));

          sections.forEach((s) => s.classList.remove("active"));

          tab.classList.add("active");

          document.getElementById(tab.dataset.section).classList.add("active");
        });
      });

      /* =========================
   AJOUTER UN MOT
========================= */

      document.getElementById("addWord").addEventListener("click", addWord);

      document
        .getElementById("wordInput")
        .addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            addWord();
          }
        });

      function addWord() {
        const input = document.getElementById("wordInput");

        const word = input.value.trim();

        if (!word) {
          showMessage("⚠️ Écris un mot.", "#d33");

          return;
        }

        const alreadyExists = words.some(
          (w) => w.toLowerCase() === word.toLowerCase(),
        );

        if (alreadyExists) {
          showMessage("⚠️ Ce mot existe déjà.", "#d33");

          return;
        }

        words.push(word);

        saveWords();

        input.value = "";

        showMessage("✅ Mot ajouté !", "#209447");

        displayWords();
      }

      function showMessage(text, color) {
        const message = document.getElementById("addMessage");

        message.textContent = text;

        message.style.color = color;
      }

      /* =========================
   SAUVEGARDE
========================= */

      function saveWords() {
        localStorage.setItem("dictationWords", JSON.stringify(words));
      }

      /* =========================
   AFFICHER LES MOTS
========================= */

      function displayWords() {
        const list = document.getElementById("wordList");

        list.innerHTML = "";

        if (words.length === 0) {
          list.innerHTML = `
            <div class="empty">
                Aucun mot ajouté.
            </div>
        `;

          return;
        }

        words.forEach((word, index) => {
          const item = document.createElement("div");

          item.className = "word-item";

          item.innerHTML = `

            <strong>
                ${escapeHTML(word)}
            </strong>

            <button
                class="btn danger"
                data-index="${index}"
            >
                🗑️ Supprimer
            </button>

        `;

          item
            .querySelector("button")
            .addEventListener("click", () => deleteWord(index));

          list.appendChild(item);
        });
      }

      /* =========================
   SUPPRIMER
========================= */

      function deleteWord(index) {
        words.splice(index, 1);

        saveWords();

        displayWords();
      }

      /* =========================
   COMMENCER
========================= */

      document.getElementById("startGame").addEventListener("click", startGame);

      function startGame() {
        if (words.length === 0) {
          document.getElementById("gameContent").innerHTML = `

            <div class="listen">
                ⚠️
            </div>

            <h2>
                Aucun mot
            </h2>

            <p>
                Ajoute d'abord des mots
                dans l'onglet « Mes mots ».
            </p>

        `;

          return;
        }

        /*
         * Mélange les mots.
         */

        quizWords = [...words].sort(() => Math.random() - 0.5);

        currentIndex = 0;

        score = 0;

        document.getElementById("score").textContent = "0";

        showWord();
      }

      /* =========================
   LIRE LE MOT
========================= */

      function speakWord(word) {
        if (!("speechSynthesis" in window)) {
          alert("La lecture vocale n'est pas disponible sur ce navigateur.");

          return;
        }

        speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(word);

        speech.lang = "fr-FR";

        speech.rate = 0.75;

        speech.pitch = 1;

        speech.volume = 1;

        speechSynthesis.speak(speech);
      }

      /* =========================
   AFFICHER LE MOT
========================= */

      function showWord() {
        waiting = false;

        const word = quizWords[currentIndex];

        const progress = (currentIndex / quizWords.length) * 100;

        document.getElementById("progressBar").style.width = progress + "%";

        document.getElementById("gameContent").innerHTML = `

        <div class="listen">
            🔊
        </div>

        <h2>
            Écoute attentivement
        </h2>

        <p class="instruction">
            Écoute le mot puis écris-le.
        </p>

        <button
            class="btn primary"
            id="listenButton"
        >
            🔊 Écouter le mot
        </button>

        <div style="margin-top:25px;">

            <input
                type="text"
                id="answerInput"
                class="answer-input"
                placeholder="Écris le mot..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>

        <button
            class="btn primary"
            id="checkButton"
        >
            ✓ Vérifier
        </button>

        <div
            class="feedback"
            id="feedback"
        ></div>

    `;

        document
          .getElementById("listenButton")
          .addEventListener("click", () => speakWord(word));

        document
          .getElementById("checkButton")
          .addEventListener("click", checkAnswer);

        const input = document.getElementById("answerInput");

        input.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            checkAnswer();
          }
        });

        /*
         * Lecture automatique.
         */

        setTimeout(() => speakWord(word), 500);
      }

      /* =========================
   VÉRIFIER
========================= */

      function checkAnswer() {
        if (waiting) return;

        const input = document.getElementById("answerInput");

        const answer = input.value.trim();

        if (!answer) {
          document.getElementById("feedback").innerHTML =
            "⚠️ Écris une réponse.";

          return;
        }

        waiting = true;

        const correctWord = quizWords[currentIndex];

        if (answer.toLowerCase() === correctWord.toLowerCase()) {
          score++;

          document.getElementById("score").textContent = score;

          document.getElementById("feedback").innerHTML = `
            <span class="correct">
                ✅ Bravo ! Bonne orthographe.
            </span>
        `;
        } else {
          document.getElementById("feedback").innerHTML = `

            <span class="wrong">
                ❌ Ce n'est pas correct.
            </span>

            <div class="correct-word">
                La bonne réponse était :
                <strong>
                    ${escapeHTML(correctWord)}
                </strong>
            </div>

        `;
        }

        setTimeout(nextWord, 1800);
      }

      /* =========================
   MOT SUIVANT
========================= */

      function nextWord() {
        currentIndex++;

        if (currentIndex >= quizWords.length) {
          finishGame();
        } else {
          showWord();
        }
      }

      /* =========================
   FIN
========================= */

      function finishGame() {
        document.getElementById("progressBar").style.width = "100%";

        const percentage = Math.round((score / quizWords.length) * 100);

        let message;

        if (percentage === 100) {
          message = "🏆 Parfait ! Aucune faute.";
        } else if (percentage >= 80) {
          message = "👏 Excellent niveau d'orthographe !";
        } else if (percentage >= 60) {
          message = "👍 Très bien ! Continue à t'entraîner.";
        } else {
          message = "💪 Continue tes dictées pour progresser.";
        }

        document.getElementById("gameContent").innerHTML = `

        <div class="listen">
            🏆
        </div>

        <h2>
            Dictée terminée !
        </h2>

        <p class="score">
            ${score} / ${quizWords.length}
        </p>

        <p>
            ${percentage}% de réussite
        </p>

        <p style="margin-top:20px;">
            ${message}
        </p>

        <button
            class="btn primary"
            id="restart"
        >
            🔄 Recommencer
        </button>

    `;

        document.getElementById("restart").addEventListener("click", startGame);
      }

      /* =========================
   PROTECTION HTML
========================= */

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* =========================
   INITIALISATION
========================= */

      displayWords();
    </script>
  </body>
</html>
